[colors]
background = #202020
foreground = #ffffff
main_color = #9999ff
tables_color = #646870

[bar/center]
background = ${colors.background}
foreground = ${colors.foreground}
height = 20
width = 98%
offset-x = 1%
offset-y = 0.1%

padding-right = 1
padding-left = 1

border-bottom-size = 2
border-bottom-color = ${colors.main_color}
font-0 = FiraCode Nerd Font:style=Bold:size=10.5;2

modules-right = network space xkeyboard space pulseaudio space battery
modules-center = date
modules-left = bspwm

[module/battery]
type = internal/battery
full-at = 99
low-at = 5

battery = BAT1
poll-interval = 5

time-format = %H:%M
format-charging = 󱐋<label-charging>
format-discharging = 󱊣<label-discharging>

format-full = full

[module/date]
type = internal/date
interval = 60
format = <label>
date = %H:%M %p%
time-alt = %a, %d %b %Y%
label = %date%%time%

[module/network]
type = internal/network
interface = wlan0
interval = 3.0
format-connected = <label-connected>
label-connected = "%essid% %{A1:sh $HOME/bin/wifimenu:} %{A}"
label-connected-foreground = #A3BE8C 
format-disconnected = <label-disconnected>
label-disconnected = "%{A1:sh $HOME/bin/wifimenu:}󰖪 %{A}"
label-disconnected-foreground = #D35F5E

[module/space]
type = custom/text
format = "  "

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = true
reverse-scroll = false

format = %{F#ffffff} %{F#ffffff}<label-state> 
ws-icon-0 = 0;0
ws-icon-1 = 1;1
ws-icon-2 = 2;2
ws-icon-3 = 3;3
ws-icon-4 = 4;4
ws-icon-5 = 5;5
ws-icon-6 = 6;6
ws-icon-7 = 7;7

label-focused =  %icon%  
label-focused-foreground = ${colors.main_color}
label-focused-underline =  #565c64
label-focused-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %icon%
label-empty-foreground =   ${colors.tables_color}
label-empty-padding = 1

label-urgent = %icon%
label-urgent-foreground = #88C0D0
label-urgent-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
label-layout-padding = 1
label-layout-foreground = #fff
label-indicator-on = %name%
layout-icon-default = some-icon
layout-icon-ru = "RU"
layout-icon-us = "US"
label-indicator-on-capslock = !
label-indicator-off-capslock =

[module/pulseaudio]
type = internal/pulseaudio

; Формат отображения (можно настроить под себя)
format-volume = <label-volume> <bar-volume>
label-volume = Vol: %percentage%%
label-volume-foreground = #ffffff
label-volume-background = #1e1e2e

; Формат для отображения иконки звука (опционально)
label-muted =  
label-muted-foreground = #ff0000

; Настройка бара громкости
bar-volume-width = 10
bar-volume-foreground-0 = #55aa55
bar-volume-foreground-1 = #55aa55
bar-volume-foreground-2 = #55aa55
bar-volume-foreground-3 = #55aa55
bar-volume-foreground-4 = #55aa55
bar-volume-foreground-5 = #f5a97f
bar-volume-foreground-6 = #f5a97f
bar-volume-gradient = false
bar-volume-indicator = |
bar-volume-fill = ─
bar-volume-empty = ─
bar-volume-empty-foreground = #444444

interval = 5
click-right = pavucontrol &
click-left = pactl set-sink-volume @DEFAULT_SINK@ +5%
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5% 
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
